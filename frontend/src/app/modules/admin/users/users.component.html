<app-page-header [title]="pageTitle" />

<div class="max-w-7xl mx-auto space-y-6 mt-6 px-4">
    <div class="flex flex-col md:flex-row justify-between items-center md:items-center gap-4">
        <!-- Left: Search -->
        <div class="w-full md:w-1/3 my-custom-form-field">
            <mat-form-field appearance="outline" class="w-full custom-small-input">
                <!-- <mat-label>🔍 Search Users</mat-label> -->
                <input matInput placeholder="Search by name or email" [(ngModel)]="searchText" />
            </mat-form-field>
        </div>

        <!-- Right: Filters + Buttons -->
        <div class="w-full md:w-2/3 flex flex-wrap gap-4 justify-start md:justify-end">
            <mat-form-field appearance="outline" class="w-40 custom-small-input">
                <!-- <mat-label>Role</mat-label> -->
                <mat-select [(ngModel)]="roleFilter">
                    <mat-option value="">All Roles</mat-option>
                    <mat-option value="Admin">Admin</mat-option>
                    <mat-option value="Provider">Provider</mat-option>
                    <mat-option value="Customer">Customer</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-40 custom-small-input">
                <!-- <mat-label>Status</mat-label> -->
                <mat-select [(ngModel)]="statusFilter">
                    <mat-option value="">All Statuses</mat-option>
                    <mat-option value="Active">Active</mat-option>
                    <mat-option value="Inactive">Inactive</mat-option>
                </mat-select>
            </mat-form-field>

            <button mat-stroked-button color="primary" class="rounded-xl shadow-md h-12" (click)="exportCSV()">
                <mat-icon class="mr-2">download</mat-icon>
                Export CSV
            </button>

            <button mat-raised-button color="primary" class="rounded-xl shadow-md h-12">
                <mat-icon class="mr-2">person_add</mat-icon>
                Add User
            </button>
        </div>
    </div>

    <!-- Users Table -->
    <div class="overflow-x-auto rounded-2xl shadow-lg border border-gray-200">
        <table mat-table [dataSource]="filteredUsers" class="min-w-full bg-white">

            <!-- Columns -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="text-left px-6 py-3 font-medium">Name</th>
                <td mat-cell *matCellDef="let user" class="px-6 py-4">{{ user.name }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef class="text-left px-6 py-3 font-medium">Email</th>
                <td mat-cell *matCellDef="let user" class="px-6 py-4">{{ user.email }}</td>
            </ng-container>

            <ng-container matColumnDef="phone">
                <th mat-header-cell *matHeaderCellDef class="text-left px-6 py-3 font-medium">Phone</th>
                <td mat-cell *matCellDef="let user" class="px-6 py-4">{{ user.phone }}</td>
            </ng-container>

            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef class="text-left px-6 py-3 font-medium">Role</th>
                <td mat-cell *matCellDef="let user" class="px-6 py-4">{{ user.role }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef class="text-left px-6 py-3 font-medium">Status</th>
                <td mat-cell *matCellDef="let user" class="px-6 py-4">
                    <span class="px-3 py-1 rounded-full text-xs font-semibold" [ngClass]="{
            'bg-green-100 text-green-700': user.status === 'Active',
            'bg-red-100 text-red-700': user.status === 'Inactive'
          }">
                        {{ user.status }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="text-left px-6 py-3 font-medium">Actions</th>
                <td mat-cell *matCellDef="let user" class="px-6 py-4 space-x-2">
                    <button mat-icon-button color="primary" matTooltip="Edit">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" matTooltip="Delete" (click)="deleteUser(user.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <!-- Header and Row -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-100"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                class="hover:bg-gray-50 transition duration-200"></tr>
        </table>
    </div>

    <!-- Pagination -->
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</div>
