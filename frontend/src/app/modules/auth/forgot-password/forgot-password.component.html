<div class="min-h-screen flex items-center justify-center bg-[#f4f7fe] px-4">
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img src="/images/biznest_logo.png" alt="BizNest Logo" class="h-12" />
        </div>

        <h2 class="text-center text-2xl font-bold text-[#1E1E1E]">Forgot Password?</h2>
        <p class="text-center text-sm text-gray-500 mt-1 mb-8">
            Enter your email and we’ll send you a link to reset your password.
        </p>

        <form>
            <!-- Email Field -->
            <mat-form-field appearance="outline" class="w-full custom-input-field">
                <input matInput placeholder="Email" type="email" />
            </mat-form-field>

            <!-- Submit Button -->
            <button mat-raised-button color="primary"
                class="w-full h-11 !bg-[#1E2A3A] !hover:bg-[#111926] !text-white !rounded-lg !transition !duration-200">
                Send Reset Link
            </button>
        </form>

        <!-- Back to Login -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Remembered your password?
            <a routerLink="/login" class="text-[#0058ca] font-semibold hover:underline">Back to Login</a>
        </p>
    </div>
</div>
