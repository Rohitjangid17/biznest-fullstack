<div class="min-h-screen flex items-center justify-center bg-[#f4f7fe] px-4">
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img src="/images/biznest_logo.png" alt="BizNest Logo" class="h-12" />
        </div>

        <h2 class="text-center text-3xl font-bold text-[#1E1E1E]">Welcome to BizNest</h2>
        <p class="text-center text-sm text-gray-500 mt-1 mb-8">
            Manage your local services, clients, and bookings — all in one place.
        </p>

        <form [formGroup]="loginForm">
            <!-- Email -->
            <mat-form-field appearance="outline" class="w-full custom-input-field">
                <input matInput placeholder="Email" formControlName="email" type="email" class="custom-input" />
            </mat-form-field>

            <!-- Password -->
            <mat-form-field appearance="outline" class="w-full custom-input-field">
                <input matInput placeholder="Password" formControlName="password" [type]="hide ? 'password' : 'text'" class="custom-input" />
                <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
                    [attr.aria-label]="'Toggle password visibility'" [attr.aria-pressed]="hide">
                    <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>

            <!-- Forgot Password -->
            <div class="text-right mb-5">
                <a routerLink="/forgot-password" class="text-sm text-[#0058ca] font-medium hover:underline">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button mat-raised-button color="primary" [disabled]="loginForm.invalid" (click)="login()"
                class="w-full h-11 !bg-[#1E2A3A] !hover:bg-[#111926] !text-white !rounded-lg !transition !duration-200">
                Log In
            </button>
        </form>

        <!-- Signup Link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Don’t have an account?
            <a routerLink="/signup" class="text-[#0058ca] font-semibold hover:underline">Sign Up</a>
        </p>
    </div>
</div>
